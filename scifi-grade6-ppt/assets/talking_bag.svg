<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Bag handle -->
  <path d="M70 60 Q70 30 100 30 Q130 30 130 60" fill="none" stroke="#16213E" stroke-width="5"/>
  <!-- Bag body -->
  <rect x="45" y="60" width="110" height="110" rx="14" fill="#FFC857" stroke="#16213E" stroke-width="4"/>
  <!-- Front pocket -->
  <rect x="65" y="100" width="70" height="50" rx="8" fill="#FF9F43" stroke="#16213E" stroke-width="3"/>
  <!-- Eyes -->
  <circle cx="80" cy="85" r="6" fill="#16213E"/>
  <circle cx="120" cy="85" r="6" fill="#16213E"/>
  <circle cx="82" cy="83" r="2" fill="#FFFFFF"/>
  <circle cx="122" cy="83" r="2" fill="#FFFFFF"/>
  <!-- Smile -->
  <path d="M85 125 Q100 138 115 125" fill="none" stroke="#16213E" stroke-width="4" stroke-linecap="round"/>
  <!-- Speech bubble -->
  <ellipse cx="160" cy="50" rx="32" ry="22" fill="#F8FAFF" stroke="#16213E" stroke-width="3"/>
  <path d="M145 65 L138 78 L152 70 Z" fill="#F8FAFF" stroke="#16213E" stroke-width="3"/>
  <text x="160" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#16213E">Hi!</text>
</svg>
